[package]
name = "p2premote-punch"
version = "2.0.0"
edition = "2021"
description = "Rust rewrite of p2premote-punch punchffi (gonc P2P hole punching + WGVPN FFI)"
license = "MIT"

[lib]
name = "p2premote_punch"
crate-type = ["staticlib", "rlib"]

[features]
default = ["ffi"]
ffi = []

# The interop driver exercises the exported C ABI, which only exists with ffi.
[[example]]
name = "interop"
required-features = ["ffi"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
socket2 = "0.6"
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdh", "arithmetic"] }
base64 = "0.22"
rand = "0.8"
if-addrs = "0.13"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_Foundation"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
