[package]
name = "p2premote-punch"
version = "2.0.0"
edition = "2021"
description = "Rust rewrite of p2premote-punch punchffi (gonc P2P hole punching + WGVPN FFI)"
license = "MIT"

[lib]
name = "p2premote_punch"
crate-type = ["staticlib", "rlib"]

[features]
default = ["ffi", "legacy-mqtt"]
ffi = []
legacy-mqtt = ["dep:rumqttc"]
port-mapping = ["dep:igd-next", "dep:xmltree", "dep:async-trait"]

# The interop driver exercises the exported C ABI, which only exists with ffi.
[[example]]
name = "interop"
required-features = ["ffi", "legacy-mqtt"]

[[example]]
name = "upnp_probe"
required-features = ["port-mapping"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
socket2 = "0.6"
rumqttc = { version = "0.24", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
md-5 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdh", "arithmetic"] }
base64 = "0.22"
rand = "0.8"
if-addrs = "0.13"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos", target_os = "android"))'.dependencies]
igd-next = { version = "0.16.2", optional = true, default-features = false, features = ["aio_tokio"] }
xmltree = { version = "0.10", optional = true }
async-trait = { version = "0.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_Foundation"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
